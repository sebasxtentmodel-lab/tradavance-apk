workflows:
  android:
    name: APK TradAvance
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      java: 17
    scripts:
      - name: Build
        script: |
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google(); mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.1.4'}}" > build.gradle
          mkdir -p app/src/main/java/com/tradavance app/src/main/res/values
          echo '<resources><string name="app_name">TradAvance</string></resources>' > app/src/main/res/values/strings.xml
          echo 'plugins{id "com.android.application"} android{namespace "com.tradavance"; compileSdk 34; defaultConfig{applicationId "com.tradavance"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0"}}' > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="TradAvance"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.tradavance; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); TextView t=new TextView(this); t.setText("TradAvance OK"); setContentView(t); } }' > app/src/main/java/com/tradavance/MainActivity.java
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
